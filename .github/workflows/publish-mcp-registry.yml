# Publishes the MCP server listings after `npm publish`:
#   1. Official MCP Registry — mcp-server/server.json (io.github.geeks-accelerator/inbed)
#   2. Smithery — MCPB bundle built from mcp-server/ (inbed/dating)
#
# Why a workflow for the registry: org namespaces (io.github.<org>/*) can't be
# published with the interactive `mcp-publisher login github`; GitHub OIDC from a
# repo owned by the org proves ownership instead. This repo is
# geeks-accelerator/in-bed-ai, so it may publish io.github.geeks-accelerator/<anything>.
#
# Smithery needs the repo secret SMITHERY_API_KEY (a key with write access to
# the `inbed` namespace).
#
# Release order: bump "version" in mcp-server/package.json, server.json (both
# fields), and manifest.json → `npm publish` from mcp-server/ → run this workflow:
#   gh workflow run publish-mcp-registry.yml -R geeks-accelerator/in-bed-ai
name: Publish MCP server listings
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets mcp-publisher prove which repo the job runs in
      contents: read
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check versions agree and npm has this version
        # Compare explicitly: `npm view pkg@<missing>` doesn't reliably exit non-zero.
        run: |
          want="$(node -p "require('./package.json').version")"
          for v in "$(node -p "require('./server.json').version")" \
                   "$(node -p "require('./server.json').packages[0].version")" \
                   "$(node -p "require('./manifest.json').version")"; do
            if [ "$v" != "$want" ]; then
              echo "Version mismatch: package.json is ${want}, found ${v} in server.json/manifest.json."
              exit 1
            fi
          done
          got="$(npm view "mcp-inbed-dating@${want}" version 2>/dev/null || true)"
          if [ -z "$want" ] || [ "$got" != "$want" ]; then
            echo "mcp-inbed-dating@${want} is not on npm yet (got '${got}'). Run npm publish first."
            exit 1
          fi
          echo "npm has mcp-inbed-dating@${want}"

      # 1. Official MCP Registry — skipped if this version is already listed, so
      #    the workflow can be re-run (e.g. to retry a failed Smithery step).
      - name: Check MCP Registry for this version
        id: registry
        run: |
          v="$(node -p "require('./package.json').version")"
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.geeks-accelerator%2Finbed/versions/${v}")"
          echo "HTTP ${code} for ${v}"
          if [ "$code" = "200" ]; then echo "listed=true" >> "$GITHUB_OUTPUT"; echo "Already on the MCP Registry — skipping publish."; fi
      - name: Install mcp-publisher
        if: steps.registry.outputs.listed != 'true'
        run: curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - if: steps.registry.outputs.listed != 'true'
        run: ./mcp-publisher login github-oidc
      - if: steps.registry.outputs.listed != 'true'
        run: ./mcp-publisher publish

      # 2. Smithery (MCPB bundle)
      - run: npm ci --no-audit --no-fund
      - name: Build MCPB bundle
        run: ./scripts/bundle.sh
      - name: Publish bundle to Smithery
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: |
          if [ -z "$SMITHERY_API_KEY" ]; then
            echo "Repo secret SMITHERY_API_KEY is not set; skipping would leave Smithery behind, so failing." >&2
            exit 1
          fi
          node scripts/publish-smithery.mjs inbed-dating.mcpb inbed/dating
