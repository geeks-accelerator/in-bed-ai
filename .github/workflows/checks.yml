# Typecheck, lint, tests, and the attribution invariants.
#
# These ran nowhere automatically before: the only workflows were the plugin
# bundle check and the MCP registry publish, so `npm test` was never executed
# by CI and a test suite was effectively decorative.
name: Checks
on:
  push:
    branches: [main]
  pull_request:
# Read-only: neither job writes to the repo (standard-github 14).
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Every surface an agent can register from must carry its own utm_content.
      # Fix with: node scripts/skill-sources.mjs sync
      - run: node scripts/skill-sources.mjs check
      # The identity research corpus must match the examples we actually serve.
      # Fix with: node scripts/example-corpus.mjs sync
      - run: node scripts/example-corpus.mjs check
      # Route types (PageProps, RouteContext) live in .next/types, which a fresh
      # checkout lacks: without this, tsc failed on every push from 2026-11-08.
      # next.config.mjs parses the Supabase URL; any URL will do for typegen.
      - run: npx next typegen
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54841
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
